(()=>{'use strict';const $=id=>document.getElementById(id), c=$('c'),g=c.getContext('2d'),W=960,H=600,KEY='kira-tiny-realm-v1';const homes=['The Hollow','The Blossom','The Bramble'],places=['Home','Bramble Stables','Pine Woods','Hidden Pond'];const names={'twig':'Twig','feather':'Feather','leaf':'Soft leaf','silk':'Spider silk','acorn':'Acorn cap','glow':'Glow seed','glass':'Sea glass','button':'Lost button','moss':'Moss','berry':'Raspberry',flower:'Wildflower',petal:'Petal',blueberry:'Blueberry'};const recipes=[['Feather broom',{feather:1,twig:1}],['Leaf bed',{leaf:2,silk:1}],['Seed lantern',{acorn:1,glow:1}],['Button table',{button:1,twig:2}],['Glass window',{glass:1,twig:1}],['Moss nest',{moss:2,leaf:1}]];const clothes=[['Petal dress',{petal:2,silk:1}],['Feather gown',{feather:2,silk:1}],['Leaf dress',{leaf:2,silk:1}],['Flower crown',{flower:2}],['Raspberry dye',{berry:2}],['Blueberry dye',{blueberry:2}],['Golden dye',{flower:1,petal:1}]]; const colors={'Rose':'#c58a9c','Raspberry dye':'#a83d69','Blueberry dye':'#6666ad','Golden dye':'#e4bc62'}; let s;function fresh(){return {home:null,preview:0,place:'Home',inv:{},crafted:[],decor:[],clean:{},picked:{},animal:false,fed:0,time:0,visits:0}}try{s=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{s=fresh()}s.look=Object.assign({hair:'Chestnut',style:'Bob',skin:'Peach',wings:'Ivory',outfit:'Everyday dress',dye:'Rose',crown:false},s.look||{});s.wardrobe=s.wardrobe||[];s.inside=!!s.inside;let history=[],backStack=[],strokeStart=null,previous=null,activePointer=null;function snapshot(){return JSON.stringify(s)}function remember(v=snapshot()){history.push(v);if(history.length>40)history.shift()}function undo(){if(!history.length)return;let time=s.time;s=JSON.parse(history.pop());s.time=time;placing=null;endStroke();loadZone();save();ui();toast('Undone.')}function goBack(){if(backStack.length){let b=backStack.pop();s.place=b.place;s.inside=b.inside;mode=b.mode;placing=null;loadZone();save();ui()}else if(s.inside){setPlace('Home',false)}else{mode='Explore';placing=null;ui()}}let mode='Explore',pos={x:480,y:430},target={...pos},placing=null,drag=false,toastTimer,frame=0,last=0,dirty=true;function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2300)}function rand(seed){let a=seed>>>0;return()=>{a=(a*1664525+1013904223)>>>0;return a/4294967296}}function zone(){return s.place==='Home'?'home'+(s.home??s.preview)+(s.inside?'-inside':''):s.place}function seedFor(z){return [...z].reduce((a,b)=>a*31+b.charCodeAt(0),7)>>>0}let debris=[],loot=[],dust=[];function loadZone(){let z=zone(),r=rand(seedFor(z)),n=s.inside?38:s.place==='Home'?65:s.place==='Bramble Stables'?55:35;debris=Array.from({length:n},(_,i)=>({id:i,x:80+r()*800,y:320+r()*235,a:r()*6.28,type:i%3,done:(s.clean[z]||[]).includes(i),vx:0,vy:0}));let types=s.inside?['silk','leaf','petal','button','feather','twig','flower','moss']:s.place==='Home'?['twig','feather','leaf','silk','acorn','glow','button','moss','twig','leaf','moss','flower','petal','petal']:s.place==='Bramble Stables'?['berry','berry','berry','berry','moss','leaf','twig','silk','flower']:s.place==='Pine Woods'?['twig','twig','feather','feather','leaf','acorn','moss','silk','glow','blueberry','blueberry','petal','flower']:['glass','glass','glow','leaf','button','moss','blueberry','petal','flower','silk'];loot=types.map((type,i)=>({type,id:i,x:100+r()*760,y:350+r()*190,hidden:i%3===0,picked:(s.picked[z]||[]).includes(i)}));pos={x:480,y:470};target={...pos};dirty=true}loadZone();
function ellipse(x,y,rx,ry,col,rot=0){g.beginPath();g.ellipse(x,y,rx,ry,rot,0,Math.PI*2);g.fillStyle=col;g.fill()}function line(x,y,x2,y2,col,w=1){g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.stroke()}function path(d,fill,stroke,w=1){let p=new Path2D(d);if(fill){g.fillStyle=fill;g.fill(p)}if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke(p)}}function leaf(x,y,size,a,col){g.save();g.translate(x,y);g.rotate(a);path(`M0 0 Q${-size} ${-size*.6} 0 ${-size*1.8} Q${size} ${-size*.6} 0 0`,col);line(0,0,0,-size*1.6,'#d1d3a144',1);g.restore()}function flower(x,y,r,col){line(x,y+30,x,y,'#516b45',3);for(let i=0;i<5;i++){let a=i*1.256;ellipse(x+Math.cos(a)*r*.75,y+Math.sin(a)*r*.75,r*.65,r*.42,col,a)}ellipse(x,y,r*.35,r*.35,'#e9bd75')}

let bg=document.createElement('canvas');bg.width=W;bg.height=H;function interior(){let h=s.home??s.preview,r=rand(seedFor(zone()));let wall=['#997454','#c89ba6','#8b785d'][h],floor=['#c3a37a','#d9b6ae','#b5a37d'][h];g.fillStyle=wall;g.fillRect(0,0,W,H);path('M0 300 Q480 260 960 300 L960 600 L0 600Z',floor);for(let i=0;i<18;i++){let x=i*60;path(`M${x} 0 Q${x+35} 140 ${x} 290`,null,h===1?'#e7c0c355':'#624b3b44',8)}for(let i=0;i<14;i++)line(0,310+i*23,960,310+i*23,'#85694a38',2);for(let i=0;i<15;i++)line(480+(i-7)*36,300,480+(i-7)*120,600,'#85694a38',2);ellipse(480,435,240,105,'#83936b');ellipse(480,435,224,91,'#a9b486');for(let i=0;i<28;i++){let a=i*6.283/28;ellipse(480+210*Math.cos(a),435+78*Math.sin(a),5,3,'#e3cd9c',a)}for(let x of [180,780]){ellipse(x,145,73,92,'#614938');ellipse(x,145,63,82,'#b9d5bb');ellipse(x-15,127,36,50,'#d8e5c4');line(x,65,x,225,'#795b43',6);line(x-61,145,x+61,145,'#795b43',6);line(x-80,235,x+80,235,'#74523d',12);for(let j=0;j<3;j++)flower(x-40+j*35,224,10,'#e8c5a2')}door(480,305);g.font='18px Georgia';g.fillStyle='#f6e1bd';g.textAlign='center';g.fillText('Outside',480,150);g.textAlign='left';for(let x of [55,905]){line(x,30,x,160,'#644a36',3);ellipse(x,170,30,35,'#f5c66d44');ellipse(x,170,13,19,'#f5d28a');ellipse(x,153,16,5,'#664a36')}for(let i=0;i<35;i++){let x=r()*W,y=310+r()*270;ellipse(x,y,2+r()*5,2,'#775b4030')}bg.getContext('2d').drawImage(c,0,0);dirty=false}function buildBg(){if(s.inside){interior();return}let old=g; // draw static scene on main, then cache
let r=rand(seedFor(zone()));let grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#304f41');grad.addColorStop(.45,'#80976a');grad.addColorStop(1,'#a2a977');g.fillStyle=grad;g.fillRect(0,0,W,H);for(let i=0;i<23;i++){let x=r()*W,y=r()*190;line(x,y-150,x+15,y+140,i%2?'#53684d':'#415c46',20+r()*45);ellipse(x,y,80+r()*70,40+r()*40,'#4c7055')}for(let i=0;i<300;i++){let x=r()*W,y=200+r()*400;ellipse(x,y,4+r()*20,2+r()*5,['#819363','#91a16e','#6e895e','#b2b685'][i%4],r()*3)}path('M390 290 Q380 380 280 430 Q190 510 100 600 L740 600 Q610 490 580 430 Q550 370 560 290Z','#c4b58a88');let h=s.home??s.preview;if(s.place==='Home'){if(h===0){path('M315 0 Q365 120 319 245 Q270 292 130 345 Q245 366 363 315 Q400 350 480 344 Q555 370 590 315 Q740 369 830 337 Q660 285 633 232 Q595 120 645 0Z','#74563e','#604a38',4);for(let i=0;i<16;i++){let x=335+i*19;path(`M${x} 0 Q${x-25} 140 ${x+5} 265`,null,i%2?'#99744d':'#584535',4+i%4)}door(480,335);for(let i=0;i<20;i++)ellipse(270+r()*420,310+r()*35,18+r()*20,8,'#73884f')}else if(h===1){line(480,0,480,340,'#526d47',40);for(let i=0;i<9;i++){let a=i*6.283/9;ellipse(480+Math.cos(a)*135,200+Math.sin(a)*90,130,70,i%2?'#c78f9f':'#dfb4ba',a)}ellipse(480,225,135,108,'#e2c7ad');door(480,330)}else{bush(400,285,2.1);bush(600,285,1.8);door(480,335)}}else if(s.place==='Bramble Stables'){bush(320,290,2);bush(620,290,2);for(let x of [300,480,660]){path(`M${x-72} 340 L${x-72} 263 Q${x} 190 ${x+72} 263 L${x+72} 340Z`,'#5c513a','#9b8455',6);ellipse(x,330,65,15,'#9ca46d');for(let i=0;i<7;i++)line(x-50+i*15,331,x-45+i*15,318,'#c5b57e',2)}}else if(s.place==='Hidden Pond'){ellipse(490,250,310,135,'#567e79');ellipse(490,250,290,118,'#81a6a0');for(let i=0;i<13;i++){let x=250+r()*480,y=175+r()*150;ellipse(x,y,25,10,'#718e59');if(i%3===0)flower(x,y-6,11,'#e7b0bc')}}else{for(let i=0;i<7;i++){let x=100+i*125;path(`M${x-12} 320 L${x-10} 80 L${x+14} 80 L${x+20} 320Z`,'#765a43');for(let j=0;j<3;j++)path(`M${x} ${20+j*70} L${x-80+j*8} ${165+j*55} L${x+80-j*8} ${165+j*55} function treasure(o){let {x,y,type}=o;ellipse(x,y+8,12,4,'#40543c55');switch(type){case 'twig':line(x-10,y+5,x+11,y-7,'#795134',5);line(x,y,x+3,y-9,'#795134',2);break;case 'feather':leaf(x-8,y+8,12,.7,'#f0e5cf');break;case 'leaf':leaf(x,y+8,13,.7,'#c5d29b');break;case 'silk':for(let i=0;i<3;i++){g.strokeStyle='#eee6d6';g.beginPath();g.ellipse(x,y,12-i*3,7-i*2,.3,0,7);g.stroke()}break;case 'acorn':ellipse(x,y,11,8,'#b38b59');ellipse(x,y-3,12,5,'#796047');break;case 'glow':ellipse(x,y,13,13,'#f8db7950');ellipse(x,y,6,7,'#fff1a0');break;case 'glass':path(`M${x-10} ${y+5} l4 -14 15 2 2 12Z`,'#a8d7d2','#d3efdf');break;case 'button':ellipse(x,y,11,10,'#d6a2a4');for(let i of [-3,3])ellipse(x+i,y,1.6,1.6,'#78585b');break;case 'moss':for(let i=0;i<5;i++)ellipse(x-8+i*4,y+Math.sin(i)*4,6,6,'#77964c');break;case 'flower':flower(x,y,8,'#e6a9c1');break;case 'petal':leaf(x,y+5,11,.7,'#e9acb8');break;case 'blueberry':for(let i=0;i<5;i++)ellipse(x+Math.cos(i)*6,y+Math.sin(i)*6,5,5,'#68699e');break;case 'berry':for(let i=0;i<7;i++)ellipse(x+Math.cos(i)*6,y+Math.sin(i)*6,5,5,'#b74e70');break}}

function kira(){let {x,y}=pos;let l=s.look,hair=({Chestnut:'#81543d',Golden:'#d4aa59',Black:'#393039',Silver:'#d9d5cb',Copper:'#aa563b'})[l.hair],skin=({Peach:'#e9bd99',Honey:'#bb885d',Deep:'#80513b',Fair:'#f4d7bf'})[l.skin],wing=({Ivory:'#e8e9c8bb',Lilac:'#d5b9efbb',Mint:'#b5e3c8bb',Rose:'#efb7c6bb'})[l.wings];ellipse(x,y+5,15,5,'#40523b66');g.save();g.translate(x,y-19);let f=Math.sin(frame*.13)*.18;ellipse(-12,-4,18,7,wing,.6+f);ellipse(12,-4,18,7,wing,-.6-f);if(l.style==='Long')ellipse(0,-3,12,21,hair);if(l.style==='Bun')ellipse(0,-26,7,7,hair);path('M-7 -4 Q0 -9 7 -4 L14 17 Q0 23 -14 17Z',colors[l.dye]||colors.Rose);if(l.outfit!=='Everyday dress'){for(let i=-2;i<=2;i++){let col=l.dye==='Rose'?(l.outfit==='Leaf dress'?'#93b477':l.outfit==='Feather gown'?'#efe0c6':'#eab4c8'):colors[l.dye];leaf(i*4,20,9,i*.23,col)}}line(-5,17,-6,24,'#765c4a',3);line(5,17,6,24,'#765c4a',3);ellipse(0,-13,11,12,hair);ellipse(0,-11,8,9,skin);path('M-10 -12 Q-10 -28 3 -25 Q13 -23 11 -11 Q3 -18 -10 -12Z',hair);if(l.crown){for(let i=-2;i<=2;i++)ellipse(i*4,-23+Math.abs(i),3,3,i%2?'#f3d38b':'#eaa9ba')}else ellipse(9,-20,4,5,'#d8a2a9');ellipse(-3,-11,1,1.4,'#493b36');ellipse(3,-11,1,1.4,'#493b36');if(mode==='Sweep'){line(10,5,24,24,'#77553d',3);for(let i=0;i<5;i++)line(24,24,22+i*3,30,'#d3b67d',2)}g.restore()}
